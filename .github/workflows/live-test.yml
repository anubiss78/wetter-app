name: Live-Test
on:
  push:
    branches: [test-live]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Datenquellen direkt prüfen
        run: |
          echo "--- DWD Radar-Zeiten"; curl -s "https://maps.dwd.de/geoserver/dwd/Niederschlagsradar/wms?service=WMS&version=1.3.0&request=GetCapabilities" | grep -o '<Dimension[^>]*name="time"[^<]*' | head -c 600; echo
          echo "--- DWD CORS"; curl -s -D - -o /dev/null -H "Origin: http://localhost:8000" "https://maps.dwd.de/geoserver/dwd/Niederschlagsradar/wms?service=WMS&version=1.3.0&request=GetCapabilities" | grep -i -E "^HTTP|access-control"
          echo "--- Bright Sky current"; curl -s "https://api.brightsky.dev/current_weather?lat=50.94&lon=6.96&tz=Europe/Berlin" | head -c 1500; echo
          echo "--- Zippopotam"; curl -s -D - "https://api.zippopotam.us/de/50667" | grep -i -E "^HTTP|access-control|place"; echo
      - name: Radarbild Deutschland prüfen (Anteil Regenpixel)
        run: |
          pip install pillow -q
          T=$(date -u -d "-15 min" +%Y-%m-%dT%H:%M:00Z | sed 's/:[0-9]\(:00Z\)/:0\1/'); M=$(date -u -d "-15 min" +%M); M=$((10#$M/5*5)); T=$(date -u -d "-15 min" +%Y-%m-%dT%H:)$(printf %02d $M):00Z; echo "Zeit $T"
          curl -s -o radar.png "https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.3.0&request=GetMap&layers=dwd:Niederschlagsradar&styles=&format=image/png&transparent=true&crs=EPSG:4326&bbox=47,5.5,55.2,15.5&width=500&height=600&time=$T"
          file radar.png; python3 -c "from PIL import Image; im=Image.open('radar.png').convert('RGBA'); a=[p for p in im.getdata() if p[3]>0]; print('Regenpixel', len(a), 'von', im.size[0]*im.size[1])"
          mkdir -p shots && cp radar.png shots/0-radar-de.png
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - name: App lokal starten und testen
        run: |
          mkdir -p shots
          (cd web && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          node tests/live-test.mjs | tee shots/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: shots }
      - name: Screenshots in Branch test-shots ablegen
        if: always()
        run: |
          cd shots && git init -q -b test-shots && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-shots
